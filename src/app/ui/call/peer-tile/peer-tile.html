@if (peer().connecting) {
  <app-member-row
    [name]="name()"
    [muted]="peer().muted"
    [away]="true"
    [note]="'peer.connectingShort' | translate"
  />
} @else if (away()) {
  <app-member-row [name]="name()" [muted]="peer().muted" [away]="true" />
} @else {
  <button class="trigger" [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
    <app-member-row
      [name]="name()"
      [muted]="peer().muted"
      [speaking]="speaking()"
      [analyser]="analyser()"
      (levelSpeaking)="reportSpeaking($event)"
    />
  </button>

  <mat-menu #menu="matMenu" class="peer-menu">
    <div class="menu" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <div class="menu-name">{{ name() }}</div>
      @if (details().length) {
        <div class="stats">{{ details().join(' · ') }}</div>
      }
      <div class="volume">
        <mat-icon>{{ peer().volume === 0 ? 'volume_off' : 'volume_up' }}</mat-icon>
        <mat-slider min="0" max="200" step="5">
          <input matSliderThumb [ngModel]="peer().volume" (ngModelChange)="setVolume($event)" />
        </mat-slider>
        <span class="value">{{ peer().volume }} %</span>
      </div>
      <button matButton class="ask-setup" (click)="requestSetup()">
        <mat-icon>auto_fix_high</mat-icon>
        {{ 'setup.ask' | translate }}
      </button>
    </div>
  </mat-menu>
}

<div class="head">
  <mat-icon class="avatar">{{ peer().muted ? 'mic_off' : 'person' }}</mat-icon>
  <div class="text">
    <span class="name">{{ name() }}</span>
    <span class="details">{{ details() }}</span>
  </div>
  @if (peer().muted) {
    <span class="badge muted" i18n="@@peer.muted">muted</span>
  }
</div>

<div
  class="meter"
  [appLevelMeter]="away() ? null : analyser()"
  (speakingChange)="speaking.set($event)"
></div>

<div class="volume">
  <mat-icon>volume_up</mat-icon>
  <mat-slider min="0" max="200" step="5">
    <input matSliderThumb [ngModel]="peer().volume" (ngModelChange)="setVolume($event)" />
  </mat-slider>
  <span class="value">{{ peer().volume }} %</span>
</div>

<div class="head">
  <span class="name">{{ channel().name }}</span>
  @if (!channel().here) {
    <span class="join-hint">{{ joinLabel }}</span>
  }
  @if (channel().deletable) {
    <button
      matIconButton
      class="delete"
      (click)="removeChannel($event)"
      (keydown.enter)="$event.stopPropagation()"
      matTooltip="Delete group"
      i18n-matTooltip="@@channel.delete"
      aria-label="Delete group"
      i18n-aria-label="@@channel.delete"
    >
      <mat-icon>delete</mat-icon>
    </button>
  }
  <span class="count">{{ channel().count }}</span>
</div>

@if (channel().count > 0) {
  <div class="members">
    @if (channel().here) {
      <app-member-tile
        [name]="selfName()"
        [self]="true"
        [muted]="audio.muted()"
        [speaking]="audio.speaking()"
        [analyser]="audio.selfAnalyser()"
        (levelSpeaking)="audio.voiceActive.set($event)"
      />
    }
    @for (peer of channel().members; track peer.id) {
      <app-peer-tile [peer]="peer" [away]="!channel().here" />
    }
  </div>
}

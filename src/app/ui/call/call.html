<div class="channels">
  @for (channel of channels(); track channel.id) {
    <app-channel-card
      [channel]="channel"
      [selfName]="selfName()"
      (enter)="room.enterChannel(channel.id)"
      (remove)="deleteGroup(channel)"
    />
  }
  <button class="new-group" (click)="room.createGroup()">
    <mat-icon>add</mat-icon>
    <span i18n="@@call.newGroup">New group</span>
  </button>
</div>

@if (room.peers().size === 0) {
  <p class="alone" i18n="@@call.alone">Nobody else is here yet. Share the invite link.</p>
}

<div class="dock">
  <button
    matIconButton
    class="mute"
    [class.off]="audio.muted()"
    (click)="toggleMute()"
    [matTooltip]="muteLabel()"
    [attr.aria-label]="muteLabel()"
    [attr.aria-pressed]="audio.muted()"
  >
    <mat-icon>{{ audio.muted() ? 'mic_off' : 'mic' }}</mat-icon>
  </button>
  <button
    matIconButton
    class="leave"
    (click)="room.leave()"
    matTooltip="Leave"
    i18n-matTooltip="@@self.leave"
    aria-label="Leave"
    i18n-aria-label="@@self.leave"
  >
    <mat-icon>call_end</mat-icon>
  </button>
</div>
